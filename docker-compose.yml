version: '2.1'

# The database's name and credentials, written once. The app and the postgres image read them
# under different variable names (the image's are fixed; the app's match the Key Vault aliases).
x-database:
  name: &db-name marketplace
  user: &db-user postgres
  password: &db-password postgres

services:
  marketplace-api:
    # Copies build/libs/amp-marketplace.jar, so run ./gradlew assemble first
    build:
      context: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DATABASE: *db-name
      POSTGRES_USER: *db-user
      POSTGRES_PASS: *db-password
      # Fakes Entra registration and APIM keys in memory; local use only (see LocalBypassConfig)
      ENTRA_BYPASS: 'true'
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: *db-name
      POSTGRES_USER: *db-user
      POSTGRES_PASSWORD: *db-password
    ports:
      - "5432:5432"
    healthcheck:
      # $$ leaves the variables for the container's shell, so this follows the values above
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
