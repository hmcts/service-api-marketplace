openapi: 3.0.3

info:
  title: API Marketplace
  description: >-
    Backend for the HMCTS API Marketplace. A signed-in person registers an
    application and receives a Client ID, a Client Secret and one APIM
    subscription key per API, which together get them through the gateway.

    Identity is supplied by the web app: it signs the person in against Entra,
    parses the token, and sends their Entra object id as requestingUserId on
    every call after /session. The backend takes that at face value and holds
    no session of its own.

    /apim/subscription-keys is where subscriptions are created, read and
    revoked. A subscription belongs to whoever created it: the name carries
    that person's prefix, amp-user001- say, and the instance is shared with
    SPS, so listing shows only their own and naming someone else's reads as
    though it is not there.
  version: 1.0.0
  contact:
    email: no-reply@hmcts.com
  license:
    name: MIT
    url: 'https://opensource.org/licenses/MIT'

servers:
  - description: Service root
    url: /

tags:
  - name: root
    description: Service root and health
  - name: session
    description: Recording the person Entra has signed in
  - name: users
    description: Who has signed in, for support and debugging
  - name: applications
    description: Entra application registrations and their APIM subscriptions
  - name: production-requests
    description: Requests for production credentials, reviewed offline
  - name: products
    description: The API catalogue, keyed by short code
  - name: subscription-keys
    description: APIM subscriptions, created against an application and revoked

paths:
  /:
    get:
      summary: Service root
      description: A static welcome message, used as a liveness sanity check.
      operationId: getRoot
      tags: [root]
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: Welcome to api-marketplace
            application/json:
              schema:
                type: string
                example: Welcome to api-marketplace

  /api/health:
    get:
      summary: Health
      description: The service is up. The database is reported by the actuator's /health.
      operationId: getHealth
      tags: [root]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /session:
    post:
      summary: Record the signed-in person
      description: >-
        Called once after Entra sign-in. The web app parses the id token and
        posts the claims; this upserts the user on their Entra object id and
        returns the row, including the long id and the userReference the Entra
        and APIM names are built from.
      operationId: createSession
      tags: [session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: The user, created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The account is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The email address is already used by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    get:
      summary: List everyone who has signed in
      description: >-
        Not user-scoped: a marketplace user can see the others. There is no
        other way to find out who is registered, because a user is only ever
        created by signing in and no environment but sbox allows a database
        connection. Carries no secret of any kind.
      operationId: listUsers
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      responses:
        '200':
          description: Every user, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UnknownUser'

  /users/{userId}:
    get:
      summary: Read one user
      description: >-
        For support and debugging, so it takes either identifier: all digits
        is the row id, anything else is an Entra object id. That is the one
        you will be holding when a call has come back "Sign in again".
      operationId: getUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
        - name: userId
          in: path
          required: true
          description: The row id or the Entra object id
          schema:
            type: string
          example: 7c1d9f2e-4b58-4a31-9f0c-2e6d8a1b3c44
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No user with that row id or Entra object id, or the caller is not known
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications:
    get:
      summary: List the caller's applications
      description: >-
        Rows owned by requestingUserId. Renders from stored data alone, with
        no call to Entra or APIM. Never includes a client secret.
      operationId: listApplications
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      responses:
        '200':
          description: The caller's applications, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UnknownUser'

    post:
      summary: Register an application
      description: >-
        Creates the Entra registration, its service principal and a secret,
        grants the role of each API asked for, then writes the row. A failed
        step removes the registration again. APIM subscriptions are separate:
        POST /apim/subscription-keys, one API per call.

        This is the only response that carries clientSecret. Entra returns it
        once and has no call that reads it back.
      operationId: createApplication
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewApplication'
      responses:
        '201':
          description: Created, with the secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UnknownUser'
        '409':
          description: The caller already has an application with that name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'
        '503':
          $ref: '#/components/responses/NotConfigured'

  /applications/{clientId}:
    parameters:
      - $ref: '#/components/parameters/RequestingUserId'
      - $ref: '#/components/parameters/ClientId'
    get:
      summary: Read one application
      description: The caller's own only, from stored data alone.
      operationId: getApplication
      tags: [applications]
      responses:
        '200':
          description: The application. Never a secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotYours'
    delete:
      summary: Delete an application
      description: >-
        Removes the Entra registration, its service principal, the role
        assignments, the APIM subscriptions and the rows. The credentials stop
        working immediately.
      operationId: deleteApplication
      tags: [applications]
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotYours'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

  /applications/{clientId}/roles:
    post:
      summary: Grant one API role
      description: >-
        Assigns an app role on the marketplace API's service principal, so the
        consumer's token starts carrying it. Nothing in APIM changes; its
        validate-jwt policy already requires the role.

        Tried once, and the failure returned. A principal that is not
        assignable yet looks identical to one that never will be, so only the
        caller can decide how long to wait. Entra can refuse for minutes after
        the application is created.
      operationId: grantRole
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        description: >-
          One API per call. The role and the resource app it lives on are
          resolved from the short code, so a caller never names either.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiAccess'
      responses:
        '204':
          description: Granted
        '400':
          description: >-
            requestingUserId or shortCode is missing, no API has that short
            code, or it offers no such role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            No user for that requestingUserId, no such application for this
            caller, or no service principal yet for that Client ID (retryable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Graph refused the assignment. The message names the missing
            permission, AppRoleAssignment.ReadWrite.All. Not retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'
        '503':
          $ref: '#/components/responses/NotConfigured'

  /applications/{clientId}/keys/{api}:
    get:
      summary: Reveal one subscription key
      description: >-
        Reads the key from APIM on demand, which also records the read in an
        access log. Only three characters are stored here, so this is the only
        way to see a whole key after creation. Unlike the client secret, a
        subscription key is always recoverable.

        Not built yet: it answers 501. Until it is, POST /apim/subscription-keys
        returns the key once and GET /apim/subscription-keys/{name}/values
        reads it back.
      operationId: getSubscriptionKey
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
        - $ref: '#/components/parameters/ClientId'
        - name: api
          in: path
          required: true
          description: The API short code
          schema:
            type: string
            example: slc
      responses:
        '200':
          description: The subscription key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotYours'
        '501':
          description: Specified, not built yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

  /production-requests:
    get:
      summary: List the caller's production credentials requests
      description: Theirs only, newest first.
      operationId: listProductionRequests
      tags: [production-requests]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      responses:
        '200':
          description: The caller's requests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductionRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UnknownUser'
    post:
      summary: Request production credentials for an application
      description: >-
        Records what was asked for. Nothing is issued here: client ids,
        secrets, subscription keys and publisher ids are still created by hand
        offline, and the Data Access Panel decides.

        One request per application. A second is a duplicate ask rather than a
        second thing being asked for, so it answers 409 and the caller is
        expected to read the existing one instead.
      operationId: createProductionRequest
      tags: [production-requests]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProductionRequest'
      responses:
        '201':
          description: Recorded, with the reference the caller quotes from here on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionRequest'
        '400':
          description: >-
            A field is missing or does not meet its rule, the declaration was
            not confirmed, or the client id is not an application of the
            caller's. Deliberately 400 rather than 404 for an unknown and
            someone else's alike, so the answer does not say whose an
            application is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/UnknownUser'
        '409':
          description: That application already has a production access request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: No unused reference could be minted. Retryable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /production-requests/{reference}:
    parameters:
      - $ref: '#/components/parameters/RequestingUserId'
      - name: reference
        in: path
        required: true
        schema:
          type: string
        example: PCR-ABCD2345
    get:
      summary: Read one request in full
      description: >-
        Everything that was asked for, for the page that shows one request.
        The list returns only the reference, status and date.
      operationId: getProductionRequest
      tags: [production-requests]
      responses:
        '200':
          description: The request, with everything that was asked for
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionRequestDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: >-
            No request with that reference, or it belongs to someone else.
            The lookup is keyed on the owner, so the two are indistinguishable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete one request
      description: >-
        Removes the request. The application it named is untouched: the
        foreign key is on delete set null, so deleting either leaves the other
        readable.
      operationId: deleteProductionRequest
      tags: [production-requests]
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: >-
            No request with that reference, or it belongs to someone else.
            The lookup is keyed on the owner, so the two are indistinguishable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /catalogue:
    get:
      summary: The APIs this site publishes
      description: >-
        Keyed by short code: what an API is, who owns it, and what subscribing
        to it needs.

        Only listed APIs appear. Nothing of anyone's in it, so no
        requestingUserId.
      operationId: listCatalogue
      tags: [catalogue]
      responses:
        '200':
          description: Every listed API, by short code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogueEntry'

  /catalogue/{shortCode}:
    parameters:
      - name: shortCode
        in: path
        required: true
        schema:
          type: string
        example: slc
    get:
      summary: One API in full
      description: >-
        Adds the description and the links the list leaves out, which are
        needed only once a single API is asked for.
      operationId: getCatalogueEntry
      tags: [catalogue]
      responses:
        '200':
          description: The API, with its description and links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueDetail'
        '404':
          description: No API with that short code, or it is not listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apim/subscription-keys:
    get:
      summary: List your subscriptions
      description: >-
        Names, scopes and state. Never key values: Azure does not return them
        from a list, and asking per subscription would be a call each. Only
        the caller's own, matched on the amp-user001- prefix in the name.
      operationId: listSubscriptionKeys
      tags: [subscription-keys]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      responses:
        '200':
          description: The subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UnknownUser'
        '500':
          $ref: '#/components/responses/ApimRefused'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'
    post:
      summary: Subscribe an application to one API
      description: >-
        One API per call, so a UI looping over several can show progress and
        report the ones that failed. The short code resolves to a product
        through the catalogue, the subscription is named
        amp-userNNN-<appname>-<shortCode>, and the row recording it against
        the application is written here. The key is in this response and
        nowhere else; reading it back is a call to APIM.

        The name is derived rather than supplied, so it always carries the
        caller's own prefix and is unique on an instance shared with SPS. A
        second subscribe to the same API answers 409: Azure's own call is a
        PUT and would silently re-point the existing subscription, reporting
        it as created.
      operationId: createSubscriptionKey
      tags: [subscription-keys]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewApiSubscription'
      responses:
        '201':
          description: Subscribed, with the key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSubscription'
        '400':
          description: No API with that short code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotYours'
        '409':
          description: Already subscribed to that API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ApimRefused'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

  /apim/subscription-keys/{name}/values:
    get:
      summary: Read the key values for one subscription
      description: >-
        Separate from the list deliberately: reading a key is worth finding in
        an access log, which it is not if every list quietly returns secrets.
      operationId: getSubscriptionKeyValues
      tags: [subscription-keys]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
        - $ref: '#/components/parameters/SubscriptionName'
      responses:
        '200':
          description: The primary and secondary keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: >-
            No subscription of that name, one belonging to someone else, or
            the configured instance does not exist. The message names the
            instance it searched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ApimRefused'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

  /apim/subscription-keys/{name}:
    delete:
      summary: Revoke a subscription
      description: >-
        Both keys stop working immediately, and the row recording the API
        against the application goes with them. Deliberately not idempotent:
        Azure answers a delete of something absent with success, which on a
        shared instance leaves you unable to tell a key you revoked from one
        that was never there.
      operationId: deleteSubscriptionKey
      tags: [subscription-keys]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
        - $ref: '#/components/parameters/SubscriptionName'
      responses:
        '204':
          description: Revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No subscription of that name, or it belongs to someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ApimRefused'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

components:
  parameters:
    RequestingUserId:
      name: requestingUserId
      in: header
      required: true
      description: >-
        The caller's Entra object id, taken from the token by the web app. The
        backend takes this at face value; the protection today is the network.
      schema:
        type: string
        example: 7c1d9f2e-4b58-4a31-9f0c-2e6d8a1b3c44

    SubscriptionName:
      name: name
      in: path
      required: true
      description: APIM's own subscription name, as returned by create
      schema:
        type: string
        example: amp-user001-case-viewer-slc

    ClientId:
      name: clientId
      in: path
      required: true
      description: The Entra Client ID (appId), not the directory object id
      schema:
        type: string
        example: 1bf041a2-a57a-4255-b90f-d218736cda1f

  responses:
    BadRequest:
      description: A field is missing or does not meet its rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnknownUser:
      description: No user for that requestingUserId. Sign in again
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotYours:
      description: >-
        No such application for this caller. Deliberately 404 rather than 403,
        which would confirm it exists and belongs to somebody
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApimRefused:
      description: >-
        API Management answered and refused. The service identity has no role
        on the instance; not a client error and not retryable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamUnreachable:
      description: Entra or API Management could not be reached. Retryable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotConfigured:
      description: >-
        The onboarding credential, or the resource app of an API asked for, is
        not configured in this environment. Should never reach a real user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    CatalogueEntry:
      type: object
      x-class-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
      properties:
        shortCode:
          type: string
          description: The key. One API is read by this, not by the repo name
          example: slc
        title:
          type: string
          example: Scheduling and Listing Court Schedule
        summary:
          type: string
          description: One line. The full text is description, on CatalogueDetail
          example: Returns the court hearing schedule for a given case.
        team:
          type: string
          description: Who owns the API. Absent where it is not known yet
          example: api-marketplace
        domain:
          type: string
          description: What the API is about. Published, not derived from its name
          example: Scheduling and listing
        platform:
          type: string
          description: Which platform publishes it
          example: Common Platform
        subscribable:
          type: boolean
          description: >-
            Whether an application can subscribe to it. False for an API that
            is listed but has no APIM product yet
          example: true

    CatalogueDetail:
      x-class-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
      allOf:
        - $ref: '#/components/schemas/CatalogueEntry'
        - type: object
          properties:
            catalogueName:
              type: string
              description: The repo, and what the published catalogue feed lists
              example: api-cp-crime-schedulingandlisting-courtschedule
            description:
              type: string
              description: The full text, which may run to several paragraphs
              example: Returns the court hearing schedule for a given case, showing when and where hearings are listed.
            docsUrl:
              type: string
              description: Published rather than derived, so docs can live anywhere
              example: https://hmcts.github.io/api-cp-crime-schedulingandlisting-courtschedule/
            repoUrl:
              type: string
              example: https://github.com/hmcts/api-cp-crime-schedulingandlisting-courtschedule
            gatewayPath:
              type: string
              description: Where it answers, under the APIM gateway
              example: amp/try/slc
            portalUrl:
              type: string
              description: >-
                The API's Try It Now page in the developer portal, where its
                operations can be run with sandbox credentials. Absent where
                no Try It Now API is configured for it
              example: https://amp-portal.sandbox.api.hmcts.net/api-details#api=try-it-now-slc
            resourceAppId:
              type: string
              description: >-
                The Entra application whose roles this API defines, which is
                what a consumer asks for a token on. Absent where the API has
                no resource app in this environment
              example: c4c8974c-2800-4fe6-964f-dcd4c0820507
