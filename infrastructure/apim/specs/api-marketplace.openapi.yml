openapi: 3.0.3

info:
  title: API Marketplace
  description: >-
    Backend for the HMCTS API Marketplace. A signed-in person registers an
    application and receives a Client ID, a Client Secret and one APIM
    subscription key per API, which together get them through the gateway.

    Identity is supplied by the web app: it signs the person in against Entra,
    parses the token, and sends their Entra object id as requestingUserId on
    every call after /session. The backend takes that at face value and holds
    no session of its own.

    /apim/subscription-keys manages APIM subscriptions directly, independently
    of any application. A subscription belongs to whoever created it: the name
    has to start with that person's prefix, amp-user001- say, and the instance
    is shared with SPS, so listing shows only their own and naming someone
    else's reads as though it is not there.
  version: 1.0.0
  contact:
    email: no-reply@hmcts.com
  license:
    name: MIT
    url: 'https://opensource.org/licenses/MIT'

servers:
  - description: Service root
    url: /

tags:
  - name: root
    description: Service root and health
  - name: session
    description: Recording the person Entra has signed in
  - name: users
    description: Who has signed in, for support and debugging
  - name: applications
    description: Entra application registrations and their APIM subscriptions
  - name: production-requests
    description: Requests for production credentials, reviewed offline
  - name: products
    description: The APIs that can be subscribed to
  - name: subscription-keys
    description: APIM subscription keys, managed directly

paths:
  /:
    get:
      summary: Service root
      description: A static welcome message, used as a liveness sanity check.
      operationId: getRoot
      tags: [root]
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: Welcome to api-marketplace

  /api/health:
    get:
      summary: Health
      operationId: getHealth
      tags: [root]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /session:
    post:
      summary: Record the signed-in person
      description: >-
        Called once after Entra sign-in. The web app parses the id token and
        posts the claims; this upserts the user on their Entra object id and
        returns the row, including the long id and the userReference the Entra
        and APIM names are built from.
      operationId: createSession
      tags: [session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: The user, created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users:
    get:
      summary: List everyone who has signed in
      description: >-
        Not user-scoped: a marketplace user can see the others. There is no
        other way to find out who is registered, because a user is only ever
        created by signing in and no environment but sbox allows a database
        connection. Carries no secret of any kind.
      operationId: listUsers
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      responses:
        '200':
          description: Every user, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/UnknownUser'

  /users/{userId}:
    get:
      summary: Read one user
      description: >-
        For support and debugging, so it takes either identifier: all digits
        is the row id, anything else is an Entra object id. That is the one
        you will be holding when a call has come back "Sign in again".
      operationId: getUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
        - name: userId
          in: path
          required: true
          description: The row id or the Entra object id
          schema:
            type: string
          example: 7c1d9f2e-4b58-4a31-9f0c-2e6d8a1b3c44
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: No user with that row id or Entra object id, or the caller is not known
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications:
    get:
      summary: List the caller's applications
      description: >-
        Rows owned by requestingUserId, joined to their APIs. Renders from
        stored data alone, with no call to Entra or APIM. Never includes a
        client secret.
      operationId: listApplications
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      responses:
        '200':
          description: The caller's applications, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/UnknownUser'

    post:
      summary: Register an application
      description: >-
        Creates the Entra registration, its service principal and a secret,
        then one APIM subscription per API, then the rows.

        Roles are **not** granted here. A service principal seconds old is not
        yet assignable, so granting is a separate call the caller retries - see
        POST /applications/{clientId}/roles.

        This is the only response that carries clientSecret. Entra returns it
        once and has no call that reads it back.
      operationId: createApplication
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewApplication'
      responses:
        '201':
          description: Created, with the secret and the full subscription keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UnknownUser'
        '409':
          description: The caller already has an application with that name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'
        '503':
          $ref: '#/components/responses/NotConfigured'

  /applications/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/RequestingUserId'
    get:
      summary: Read one application
      operationId: getApplication
      tags: [applications]
      responses:
        '200':
          description: The application, with the APIs it holds. Never a secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotYours'
    delete:
      summary: Delete an application
      description: >-
        Removes the Entra registration, its service principal, the role
        assignments, the APIM subscriptions and the rows. The credentials stop
        working immediately.
      operationId: deleteApplication
      tags: [applications]
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotYours'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

  /applications/{clientId}/roles:
    post:
      summary: Grant one API role
      description: >-
        Assigns an app role on the marketplace API's service principal, so the
        consumer's token starts carrying it. Nothing in APIM changes; its
        validate-jwt policy already requires the role.

        Tried once, and the failure returned. A principal that is not
        assignable yet looks identical to one that never will be, so only the
        caller can decide how long to wait. Entra can refuse for minutes after
        the application is created.
      operationId: grantRole
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/RequestingUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  example: slc.read
      responses:
        '204':
          description: Granted
        '400':
          description: The API offers no such role; the message lists the ones it does
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No service principal yet for that Client ID. Retryable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Graph refused the assignment. The message names the missing
            permission, AppRoleAssignment.ReadWrite.All. Not retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

  /applications/{clientId}/keys/{api}:
    get:
      summary: Reveal one subscription key
      description: >-
        Reads the key from APIM on demand, which also records the read in an
        access log. Only three characters are stored here, so this is the only
        way to see a whole key after creation. Unlike the client secret, a
        subscription key is always recoverable.
      operationId: getSubscriptionKey
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/RequestingUserId'
        - name: api
          in: path
          required: true
          description: The API short code
          schema:
            type: string
            example: slc
      responses:
        '200':
          description: The subscription key
          content:
            application/json:
              schema:
                type: object
                properties:
                  shortCode:
                    type: string
                    example: slc
                  subscriptionKey:
                    type: string
                    example: c5212ea63015c827b1a0f713fdbf42d6
        '404':
          $ref: '#/components/responses/NotYours'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

  /production-requests:
    get:
      summary: List the caller's production credentials requests
      description: Theirs only, newest first.
      operationId: listProductionRequests
      tags: [production-requests]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      responses:
        '200':
          description: The caller's requests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductionRequest'
        '404':
          $ref: '#/components/responses/UnknownUser'
    post:
      summary: Request production credentials for an application
      description: >-
        Records what was asked for. Nothing is issued here: client ids,
        secrets, subscription keys and publisher ids are still created by hand
        offline, and the Data Access Panel decides.
        declarationConfirmed is checked server side rather than trusted from
        the form, because it is the legal gate on production access.
      operationId: createProductionRequest
      tags: [production-requests]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProductionRequest'
      responses:
        '201':
          description: Recorded, with the reference the caller quotes from here on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionRequest'
        '400':
          description: >-
            A field is missing or does not meet its rule, the declaration was
            not confirmed, or the client id is not an application of the
            caller's. Deliberately 400 rather than 404 for an unknown and
            someone else's alike, so the answer does not say whose an
            application is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/UnknownUser'

  /apim/products:
    get:
      summary: List the APIs that can be subscribed to
      description: >-
        What the UI offers on the create form. Hard-coding the list means a
        product renamed in APIM silently produces a 400 on create.
      operationId: listProducts
      tags: [products]
      responses:
        '200':
          description: The products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

  /apim/subscription-keys:
    get:
      summary: List your subscriptions
      description: >-
        Names, scopes and state. Never key values: Azure does not return them
        from a list, and asking per subscription would be a call each. Only
        the caller's own, matched on the amp-user001- prefix in the name.
      operationId: listSubscriptionKeys
      tags: [subscription-keys]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      responses:
        '200':
          description: The subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionKey'
        '404':
          $ref: '#/components/responses/UnknownUser'
        '500':
          $ref: '#/components/responses/ApimRefused'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'
    post:
      summary: Create a subscription key
      description: >-
        Scoped to one product. The name must start with the caller's prefix,
        which is what makes the subscription theirs, and has to be unique
        across an instance shared with SPS. The name is checked first and a
        clash answers 409: Azure's own call is a PUT and would silently
        re-point an existing subscription at a different product, reporting it
        as created.
      operationId: createSubscriptionKey
      tags: [subscription-keys]
      parameters:
        - $ref: '#/components/parameters/RequestingUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, productId, displayName]
              properties:
                name:
                  type: string
                  description: >-
                    Azure's rule: lower case letters, digits and hyphens, 2 to
                    80 characters, not starting or ending with a hyphen. Must
                    begin with the caller's own prefix
                  pattern: '^[a-z0-9][a-z0-9-]{0,78}[a-z0-9]$'
                  example: amp-user001-case-viewer-slc
                productId:
                  type: string
                  example: cp-crime-schedulingandlisting-courtschedule
                displayName:
                  type: string
                  example: Case Viewer
      responses:
        '201':
          description: Created, with both key values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UnknownUser'
        '409':
          description: A subscription of that name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ApimRefused'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

  /apim/subscription-keys/{name}/values:
    get:
      summary: Read the key values for one subscription
      description: >-
        Separate from the list deliberately: reading a key is worth finding in
        an access log, which it is not if every list quietly returns secrets.
      operationId: getSubscriptionKeyValues
      tags: [subscription-keys]
      parameters:
        - $ref: '#/components/parameters/SubscriptionName'
        - $ref: '#/components/parameters/RequestingUserId'
      responses:
        '200':
          description: The primary and secondary keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionKey'
        '404':
          description: >-
            No subscription of that name, one belonging to someone else, or
            the configured instance does not exist. The message names the
            instance it searched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ApimRefused'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

  /apim/subscription-keys/{name}:
    delete:
      summary: Revoke a subscription
      description: >-
        Both keys stop working immediately. Deliberately not idempotent: Azure
        answers a delete of something absent with success, which on a shared
        instance leaves you unable to tell a key you revoked from one that was
        never there.
      operationId: deleteSubscriptionKey
      tags: [subscription-keys]
      parameters:
        - $ref: '#/components/parameters/SubscriptionName'
        - $ref: '#/components/parameters/RequestingUserId'
      responses:
        '204':
          description: Revoked
        '404':
          description: No subscription of that name, or it belongs to someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ApimRefused'
        '502':
          $ref: '#/components/responses/UpstreamUnreachable'

components:
  parameters:
    RequestingUserId:
      name: requestingUserId
      in: header
      required: true
      description: >-
        The caller's Entra object id, taken from the token by the web app. The
        backend takes this at face value; the protection today is the network.
      schema:
        type: string
        example: 7c1d9f2e-4b58-4a31-9f0c-2e6d8a1b3c44

    SubscriptionName:
      name: name
      in: path
      required: true
      description: APIM's own subscription name, as returned by create
      schema:
        type: string
        example: amp-user001-case-viewer-slc

    ClientId:
      name: clientId
      in: path
      required: true
      description: The Entra Client ID (appId), not the directory object id
      schema:
        type: string
        example: 1bf041a2-a57a-4255-b90f-d218736cda1f

  responses:
    BadRequest:
      description: A field is missing or does not meet its rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnknownUser:
      description: No user for that requestingUserId. Sign in again
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotYours:
      description: >-
        No such application for this caller. Deliberately 404 rather than 403,
        which would confirm it exists and belongs to somebody
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApimRefused:
      description: >-
        API Management answered and refused. The service identity has no role
        on the instance; not a client error and not retryable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamUnreachable:
      description: Entra or API Management could not be reached. Retryable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotConfigured:
      description: >-
        The onboarding credential is not configured in this environment. Should
        never reach a real user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    SessionRequest:
      type: object
      required: [objectId, email]
      properties:
        objectId:
          type: string
          description: The oid claim. The identity, and the upsert key
          example: 7c1d9f2e-4b58-4a31-9f0c-2e6d8a1b3c44
        email:
          type: string
          format: email
          example: ada.lovelace@hmcts.net
        name:
          type: string
          description: The display name from the token
          example: Ada Lovelace

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userReference:
          type: string
          description: Formatted from id. Appears in every Entra and APIM name
          example: user001
        email:
          type: string
          format: email
          example: ada.lovelace@hmcts.net
        name:
          type: string
          example: Ada Lovelace
        status:
          type: string
          example: ACTIVE

    NewApplication:
      type: object
      required: [name, apis]
      properties:
        name:
          type: string
          description: >-
            Letters, digits and spaces only, 8 to 50 characters, starting and
            ending on a letter or digit. Lower-cased with spaces turned to
            hyphens, it becomes the stem of the Entra and APIM names, which
            cannot be renamed afterwards.
          pattern: '^[A-Za-z0-9][A-Za-z0-9 ]{6,48}[A-Za-z0-9]$'
          example: Case Viewer
        apis:
          type: array
          minItems: 1
          items:
            type: string
          example: [slc]

    Application:
      type: object
      properties:
        clientId:
          type: string
          example: 1bf041a2-a57a-4255-b90f-d218736cda1f
        name:
          type: string
          example: Case Viewer
        appname:
          type: string
          example: case-viewer
        secretHint:
          type: string
          description: The first three characters, shown as "Uc6****"
          example: Uc6
        secretExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        apis:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationApi'

    ApplicationApi:
      type: object
      properties:
        shortCode:
          type: string
          example: slc
        productId:
          type: string
          description: Shown as Publisher ID
          example: cp-crime-schedulingandlisting-courtschedule
        subscriptionName:
          type: string
          example: amp-user001-case-viewer-slc
        keyHint:
          type: string
          description: The first three characters of the subscription key
          example: a1b
        subscribedAt:
          type: string
          format: date-time

    CreatedApplication:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          properties:
            clientSecret:
              type: string
              description: >-
                Shown once and never again. Entra has no call that reads it
                back, so a lost secret means regenerating.
              example: Uc6Q~shown-once-never-again
            subscriptionKeys:
              type: array
              items:
                type: object
                properties:
                  shortCode:
                    type: string
                    example: slc
                  subscriptionKey:
                    type: string
                    example: c5212ea63015c827b1a0f713fdbf42d6

    NewProductionRequest:
      type: object
      required: [clientId, organisation, goLiveDate, callVolume, dpia, dsa, securityContact,
                 useCase, declarationConfirmed]
      properties:
        clientId:
          type: string
          description: Which sandbox application is going live. Production covers the same APIs
          example: 1bf041a2-a57a-4255-b90f-d218736cda1f
        organisation:
          type: string
          maxLength: 255
          example: Example Legal Ltd
        goLiveDate:
          type: string
          format: date
          example: '2027-03-27'
        callVolume:
          type: string
          enum: [low, medium, high]
        dpia:
          type: string
          enum: [yes, no]
          description: Whether a Data Protection Impact Assessment has been done
        dsa:
          type: string
          enum: [in-place, in-progress, not-needed]
          description: The state of the Data Sharing Agreement
        securityContact:
          type: string
          format: email
          description: Prefilled with the caller's own address, but editable
        useCase:
          type: string
          maxLength: 1000
        declarationConfirmed:
          type: boolean
          description: Must be true. The declaration that the application was tested in sandbox

    ProductionRequest:
      type: object
      properties:
        reference:
          type: string
          description: Minted here, never supplied by the caller
          example: PCR-7K2MQX4B
        status:
          type: string
          example: SUBMITTED
        submittedAt:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        productId:
          type: string
          example: cp-crime-schedulingandlisting-courtschedule
        displayName:
          type: string
          example: Scheduling and Listing Court Schedule
        description:
          type: string
        state:
          type: string
          example: published

    SubscriptionKey:
      type: object
      properties:
        name:
          type: string
          description: APIM's subscription name, and the id for the other calls
          example: amp-user001-case-viewer-slc
        displayName:
          type: string
          example: Case Viewer
        scope:
          type: string
          description: Azure's full resource path, ending /products/{productId}
        productId:
          type: string
          description: >-
            Lifted out of scope. Absent where the subscription covers the whole
            service rather than one product
          example: cp-crime-schedulingandlisting-courtschedule
        state:
          type: string
          example: active
        primaryKey:
          type: string
          description: Present only on create and on the values call
        secondaryKey:
          type: string
          description: For rotation without downtime

    Error:
      type: object
      properties:
        error:
          type: string
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
