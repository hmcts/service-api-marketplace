server:
  port: 8080
  shutdown: "graceful"
  # Behind the ingress every request arrives from the proxy; this makes the client address the real
  # one, which the sign-in rate limit is keyed on.
  forward-headers-strategy: native

management:
  endpoint:
    health:
      show-details: "always"
      group:
        readiness:
          include: "db"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus

spring:
  config:
    import: "optional:configtree:/mnt/secrets/apim/,optional:configtree:/mnt/secrets/apim-sbox/"
  application:
    name: service-api-marketplace
  jpa:
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:marketplace}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASS:postgres}
    hikari:
      maximumPoolSize: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Required for the APIM subscription key endpoints. The zero default is so the application starts
# without it; calls to API Management fail until the real subscription is supplied.
#
# One tenant covers all of HMCTS, and workload identity injects AZURE_TENANT_ID into the pod, so
# only the subscription needs supplying - and it is the SPS platform's, not the one the cluster
# runs in.
apim:
  tenant-id: ${AZURE_TENANT_ID:00000000-0000-0000-0000-000000000000}
  subscription-id: ${APIM_SUBSCRIPTION_ID:00000000-0000-0000-0000-000000000000}
  resource-group: ${APIM_RESOURCE_GROUP:rg-sps-platform-sbox}
  service-name: ${APIM_SERVICE_NAME:sps-api-mgmt-sbox}

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}
