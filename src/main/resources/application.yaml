server:
  port: 8080
  shutdown: "graceful"
  # Behind the ingress every request arrives from the proxy; this makes the client address the real
  # one, which the sign-in rate limit is keyed on.
  forward-headers-strategy: native

management:
  endpoint:
    health:
      show-details: "always"
      group:
        readiness:
          include: "db"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus

spring:
  config:
    # The chart mounts each vault at /mnt/secrets/<vault>/; amp-marketplace is the vault since AMP-1244,
    # amp and amp-sbox are the old names. kvspsextidsbox holds the Entra onboarding credentials,
    # managed by hmcts/external-entra-id.
    import: "optional:configtree:/mnt/secrets/amp-marketplace/,optional:configtree:/mnt/secrets/amp-marketplace-sbox/,optional:configtree:/mnt/secrets/amp/,optional:configtree:/mnt/secrets/amp-sbox/,optional:configtree:/mnt/secrets/kvspsextidsbox/"
  application:
    name: service-api-marketplace
  jpa:
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:marketplace}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASS:postgres}
    hikari:
      maximumPoolSize: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Preview and AAT share one database, so a PR's preview can record migrations that never
    # reach master (V1.011-V1.014 from #113). Without this, every later build refuses to start.
    ignore-migration-patterns: "*:missing"

apim:
  tenant-id: ${AZURE_TENANT_ID:531ff96d-0ae9-462a-8d2d-bec7c0b42082}
  subscription-id: ${APIM_SUBSCRIPTION_ID:bd2864ed-4f3e-45ed-9c6a-8d179674bab1}
  resource-group: ${APIM_RESOURCE_GROUP:rg-sps-platform-sbox}
  service-name: ${APIM_SERVICE_NAME:sps-api-mgmt-sbox}

notify:
  api-key: ${NOTIFY_API_KEY:}
  base-url: ${NOTIFY_BASE_URL:https://api.notifications.service.gov.uk}
  review-inboxes: ${NOTIFY_REVIEW_INBOXES:APIMarketplace@hmcts.net}

entra:
  max-attempts: ${ENTRA_MAX_ATTEMPTS:20}
  retry-delay-millis: ${ENTRA_RETRY_DELAY_MILLIS:500}
  tenant-id: ${ENTRA_TENANT_ID:d44f885c-4fac-47bf-afde-d7d861ec4d7b}
  # One resource app per API, per environment. The app id is the audience a consumer scopes on,
  # so it is published rather than kept secret, and it belongs in the chart not the vault. Blank
  # refuses a grant for that API with a 503 rather than stopping the pod.
  resource-app-ids:
    slc: ${ENTRA_RESOURCE_APP_ID_SLC:c4c8974c-2800-4fe6-964f-dcd4c0820507}
    rcc: ${ENTRA_RESOURCE_APP_ID_RCC:}
  onboarding-client-id: ${ENTRA_ONBOARDING_CLIENT_ID:aba0879b-39e2-452a-b934-f922cd9e6acb}
  onboarding-client-secret: ${ENTRA_ONBOARDING_CLIENT_SECRET:}

# Local only: fakes Entra registration and APIM subscription keys in memory (LocalBypassConfig).
# Never set ENTRA_BYPASS in a chart.
local-bypass:
  enabled: ${ENTRA_BYPASS:false}

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}
