version: '2.1'

# Shared by both services, which read them under different variable names
x-database:
  name: &db-name marketplace
  user: &db-user postgres
  password: &db-password postgres

services:
  marketplace-api:
    build:
      context: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DATABASE: *db-name
      POSTGRES_USER: *db-user
      POSTGRES_PASS: *db-password
      ENTRA_BYPASS: 'true'
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: *db-name
      POSTGRES_USER: *db-user
      POSTGRES_PASSWORD: *db-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
