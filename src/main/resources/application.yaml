server:
  port: 8080
  shutdown: "graceful"
  # Behind the ingress every request arrives from the proxy; this makes the client address the real
  # one, which the sign-in rate limit is keyed on.
  forward-headers-strategy: native

management:
  endpoint:
    health:
      show-details: "always"
      group:
        readiness:
          include: "db"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus

spring:
  config:
    import: "optional:configtree:/mnt/secrets/apim/,optional:configtree:/mnt/secrets/apim-sbox/"
  application:
    name: service-api-marketplace
  jpa:
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:marketplace}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASS:postgres}
    hikari:
      maximumPoolSize: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}
