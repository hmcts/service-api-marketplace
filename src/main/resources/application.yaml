server:
  port: 8080
  shutdown: "graceful"
  # Behind the ingress every request arrives from the proxy; this makes the client address the real
  # one, which the sign-in rate limit is keyed on.
  forward-headers-strategy: native

management:
  endpoint:
    health:
      show-details: "always"
      group:
        readiness:
          include: "db"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus

spring:
  config:
    # kvspsextidsbox holds the Entra onboarding credentials, managed by hmcts/external-entra-id.
    import: "optional:configtree:/mnt/secrets/apim/,optional:configtree:/mnt/secrets/apim-sbox/,optional:configtree:/mnt/secrets/kvspsextidsbox/"
  application:
    name: service-api-marketplace
  jpa:
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:marketplace}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASS:postgres}
    hikari:
      maximumPoolSize: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Preview and AAT share one database, so a PR's preview can record migrations that never
    # reach master (V1.011-V1.014 from #113). Without this, every later build refuses to start.
    ignore-migration-patterns: "*:missing"

apim:
  # APIM_TENANT_ID and not AZURE_TENANT_ID: the AKS workload identity webhook injects
  # AZURE_TENANT_ID for DefaultAzureCredential, and setting that in the chart would fight
  # it. This one only picks the AzureProfile.
  # Defaults are sbox, the same values as infrastructure/sandbox.tfvars, so a local run needs a
  # credential and nothing else. Every deployed environment sets all four in its own chart values.
  tenant-id: ${APIM_TENANT_ID:531ff96d-0ae9-462a-8d2d-bec7c0b42082}
  subscription-id: ${APIM_SUBSCRIPTION_ID:bd2864ed-4f3e-45ed-9c6a-8d179674bab1}
  resource-group: ${APIM_RESOURCE_GROUP:rg-sps-platform-sbox}
  service-name: ${APIM_SERVICE_NAME:sps-api-mgmt-sbox}

entra:
  max-attempts: ${ENTRA_MAX_ATTEMPTS:20}
  retry-delay-millis: ${ENTRA_RETRY_DELAY_MILLIS:500}
  tenant-id: ${ENTRA_TENANT_ID:d44f885c-4fac-47bf-afde-d7d861ec4d7b}
  api-client-id: ${ENTRA_API_CLIENT_ID:30288840-e345-4543-99ee-f9253d789339}
  onboarding-client-id: ${ENTRA_ONBOARDING_CLIENT_ID:aba0879b-39e2-452a-b934-f922cd9e6acb}
  onboarding-client-secret: ${ENTRA_ONBOARDING_CLIENT_SECRET:}

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}
