# Don't modify this file, it is only needed for the pipeline to set the image and ingressHost
java:
  image: ${IMAGE_NAME}
  ingressHost: apim-marketplace-staging.aat.platform.hmcts.net
  # Required: the application refuses to start without APIM_SUBSCRIPTION_ID, and the other three
  # stop it inheriting another environment's instance from the defaults in application.yaml.
  # Not secret - the same values are in infrastructure/{env}.tfvars.
  environment:
    APIM_TENANT_ID: 531ff96d-0ae9-462a-8d2d-bec7c0b42082
    APIM_SUBSCRIPTION_ID: 70bea6e3-384f-4cf4-b551-743a78d716cd
    APIM_RESOURCE_GROUP: rg-sps-platform-aat
    APIM_SERVICE_NAME: sps-api-mgmt-aat
  keyVaults:
    apim:
      secrets:
        - name: marketplace-POSTGRES-USER
          alias: POSTGRES_USER
        - name: marketplace-POSTGRES-PASS
          alias: POSTGRES_PASS
        - name: marketplace-POSTGRES-HOST
          alias: POSTGRES_HOST
        - name: marketplace-POSTGRES-PORT
          alias: POSTGRES_PORT
        - name: marketplace-POSTGRES-DATABASE
          alias: POSTGRES_DATABASE
        # Application registration (PR #84) needs these four, but they do not exist in this
        # environment's vault yet. Listing a secret that is missing does not just disable the
        # feature: the pod cannot mount its secrets volume and never leaves Init, so the AAT
        # deploy hangs and the Jenkins build is aborted. Uncomment them once CloudOps have
        # created all four in the vault (see the credentials ticket raised alongside #84).
        # - name: marketplace-ENTRA-ONBOARDING-CLIENT-ID
        #   alias: ENTRA_ONBOARDING_CLIENT_ID
        # - name: marketplace-ENTRA-ONBOARDING-CLIENT-SECRET
        #   alias: ENTRA_ONBOARDING_CLIENT_SECRET
        # - name: marketplace-APIM-CLIENT-ID
        #   alias: APIM_CLIENT_ID
        # - name: marketplace-APIM-CLIENT-SECRET
        #   alias: APIM_CLIENT_SECRET
